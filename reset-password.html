<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password • Optician's Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1a2e26; --pine: #2f4a3e; --sage: #5f776c;
      --ink: #1a1f1c; --ink-2: #4a5450; --bg: #f0f3f1;
      --card: #ffffff; --radius: 14px; --error: #c0392b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 60% at 15% 0%, rgba(47,74,62,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 85% 100%, rgba(95,119,108,0.07) 0%, transparent 55%);
      color: var(--ink); min-height: 100vh; margin: 0;
      display: flex; flex-direction: column;
    }
    .auth-header {
      background: var(--forest); padding: 0 32px; height: 60px;
      display: flex; align-items: center;
      box-shadow: 0 1px 0 rgba(255,255,255,0.06), 0 4px 24px rgba(0,0,0,0.18);
    }
    .auth-brand {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.15rem; color: #fff; text-decoration: none;
    }
    .auth-brand span {
      color: rgba(255,255,255,0.4); font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem; font-weight: 400; margin-left: 10px;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .auth-main {
      flex: 1; display: flex; align-items: center;
      justify-content: center; padding: 48px 24px;
    }
    .auth-wrap { width: 100%; max-width: 420px; }
    .auth-card {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      padding: 40px; animation: fadeUp 0.3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-card__eyebrow {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--sage); margin-bottom: 6px;
    }
    .auth-card h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.75rem; color: var(--forest); margin: 0 0 28px; line-height: 1.2;
    }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 0.82rem; font-weight: 600; color: var(--ink-2); }
    .field input {
      padding: 11px 14px; border-radius: 10px;
      border: 1.5px solid rgba(0,0,0,0.10); background: #f8faf9;
      font-size: 0.97rem; font-family: 'DM Sans', sans-serif; color: var(--ink);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s; width: 100%;
    }
    .field input:focus {
      border-color: var(--sage); box-shadow: 0 0 0 3px rgba(95,119,108,0.12); background: #fff;
    }
    .auth-error {
      background: #fdf2f2; border: 1px solid rgba(192,57,43,0.2);
      border-radius: 10px; padding: 11px 14px; font-size: 0.85rem;
      color: var(--error); margin-bottom: 16px; display: none;
    }
    .auth-error.visible { display: block; }
    .auth-success {
      background: #f0faf5; border: 1px solid rgba(46,125,82,0.2);
      border-radius: 10px; padding: 16px; font-size: 0.88rem;
      color: #2e7d52; margin-bottom: 16px; line-height: 1.5; display: none;
    }
    .auth-success.visible { display: block; }
    /* Invalid token state */
    .token-invalid {
      text-align: center; padding: 8px 0;
    }
    .token-invalid p { color: var(--ink-2); font-size: 0.9rem; margin: 0 0 20px; line-height: 1.55; }
    .auth-btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: var(--forest); color: #fff; font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer;
      transition: background 0.15s; margin-top: 4px; text-decoration: none;
      display: block; text-align: center;
    }
    .auth-btn:hover:not(:disabled) { background: var(--pine); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-btn__spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto;
    }
    .auth-btn.loading .auth-btn__text  { display: none; }
    .auth-btn.loading .auth-btn__spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-footer { text-align: center; padding: 20px; font-size: 0.78rem; color: #9aaba5; }

    body.dark { background: #111916; color: #d8e4df; }
    body.dark .auth-card { background: #1c2620; border-color: #263028; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    body.dark .auth-card h1       { color: #c8ddd6; }
    body.dark .auth-card__eyebrow { color: #5f776c; }
    body.dark .field label        { color: #7a9488; }
    body.dark .field input        { background: #222e28; border-color: #2e3c36; color: #d8e4df; }
    body.dark .field input:focus  { border-color: var(--sage); background: #263028; }
    body.dark .page-footer        { color: #3d5248; }
    body.dark .token-invalid p    { color: #7a9488; }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 24px; }
      .auth-header { padding: 0 20px; }
    }
  </style>
</head>
<body>
  <header class="auth-header">
    <a class="auth-brand" href="/">Optician's Desk <span>NZ</span></a>
  </header>

  <main class="auth-main">
    <div class="auth-wrap">
      <div class="auth-card" id="authCard">
        <!-- Content injected by JS based on token presence -->
      </div>
    </div>
  </main>

  <footer class="page-footer">Optician's Desk — built for NZ optical dispensing</footer>

  <script>
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

    const card  = document.getElementById('authCard');
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      // No token in URL — show error state
      card.innerHTML = `
        <div class="auth-card__eyebrow">Password reset</div>
        <h1>Invalid link</h1>
        <div class="token-invalid">
          <p>This reset link is missing or invalid. Please request a new one.</p>
          <a class="auth-btn" href="/forgot-password">Request new link</a>
        </div>
      `;
    } else {
      // Valid token — show the form
      card.innerHTML = `
        <div class="auth-card__eyebrow">Password reset</div>
        <h1>New password</h1>
        <div class="auth-error" id="authError"></div>
        <div class="auth-success" id="authSuccess"></div>
        <div id="formFields">
          <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="••••••••" required />
          </div>
          <button class="auth-btn" id="submitBtn" type="button">
            <span class="auth-btn__text">Set new password</span>
            <span class="auth-btn__spinner"></span>
          </button>
        </div>
      `;

      const passEl    = document.getElementById('password');
      const confEl    = document.getElementById('confirmPassword');
      const errorEl   = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const submitBtn = document.getElementById('submitBtn');
      const formFields = document.getElementById('formFields');

      function showError(msg) { errorEl.textContent = msg; errorEl.classList.add('visible'); }
      function clearError()   { errorEl.classList.remove('visible'); }
      function setLoading(on) { submitBtn.disabled = on; submitBtn.classList.toggle('loading', on); }

      async function doReset() {
        clearError();
        const password = passEl.value;
        const confirm  = confEl.value;

        if (!password)         { showError('Please enter a new password.'); return; }
        if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
        if (password !== confirm) { showError('Passwords do not match.'); confEl.focus(); return; }

        setLoading(true);

        try {
          const res  = await fetch('/auth/reset-password', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ token, password })
          });
          const data = await res.json();

          if (!res.ok) {
            showError(data.error || 'Reset failed. The link may have expired.');
            setLoading(false);
            return;
          }

          formFields.style.display = 'none';
          successEl.innerHTML = 'Your password has been updated. <a href="/login" style="color:#2e7d52;font-weight:600;">Log in</a>';
          successEl.classList.add('visible');

        } catch {
          showError('Network error. Please try again.');
          setLoading(false);
        }
      }

      submitBtn.addEventListener('click', doReset);
      confEl.addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); });
    }
  </script>
</body>
</html>
